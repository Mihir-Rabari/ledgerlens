services:
  falkordb:
    image: falkordb/falkordb:latest
    container_name: ledgerlens-db
    restart: unless-stopped
    volumes:
      - falkordb-data:/data
    networks:
      - default
    # No host ports: the app reaches FalkorDB over the internal network, and
    # the public surface is only the FastAPI app behind the reverse proxy.

  app:
    build: .
    container_name: ledgerlens-app
    restart: unless-stopped
    depends_on:
      - falkordb
    environment:
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: 6379
      LL_AUTH_SECRET: ${LL_AUTH_SECRET:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
    command: >
      sh -c "python scripts/seed_if_needed.py &&
             uvicorn app:app --host 0.0.0.0 --port 8000"
    networks:
      - default
      - dokploy-network

networks:
  default:
  dokploy-network:
    external: true

volumes:
  falkordb-data:
